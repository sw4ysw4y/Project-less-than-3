  #taskbar {

<script>
  // set background image
  document.documentElement.style.setProperty('--bg-url', `url("${CONFIG.BACKGROUND_IMAGE}")`);

  // boot sequence
  window.addEventListener('load', () => {
    setTimeout(() => {
      document.getElementById('boot').classList.add('hide');
    }, 1800);
    renderPhotos();
    updateTaskbar();
  });

  // clock
  function updateClock(){
    const d = new Date();
    let h = d.getHours(), m = d.getMinutes();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    document.getElementById('clock').textContent =
      `${h}:${String(m).padStart(2,'0')} ${ampm}`;
  }
  updateClock();
  setInterval(updateClock, 1000 * 15);

  // fill in text from CONFIG
  document.getElementById('title-line').textContent = CONFIG.TITLE_LINE;

  // live counter (starts from May 30th 2026)
  const start = new Date(CONFIG.START_DATE);
  function pad(n){ return String(n).padStart(2,'0'); }
  function tickCounter(){
    const now = new Date();
    let diff = Math.max(0, now - start) / 1000; // seconds
    const days = Math.floor(diff / 86400);
    diff -= days * 86400;
    const hrs = Math.floor(diff / 3600);
    diff -= hrs * 3600;
    const mins = Math.floor(diff / 60);
    const secs = Math.floor(diff - mins * 60);
    document.getElementById('counter-display').innerHTML =
      `<span class="counter-num">${days}</span> days, ` +
      `<span class="counter-num">${pad(hrs)}</span>:<span class="counter-num">${pad(mins)}</span>:<span class="counter-num">${pad(secs)}</span>`;
  }
  tickCounter();
  setInterval(tickCounter, 1000);

  /* ---------- Window Management System ---------- */
  let topZIndex = 100;
  const windows = {
    'win-counter': { title: 'Notes.txt', icon: '📝' },
    'win-photos': { title: 'My Photos', icon: '🖼️' }
  };

  function bringToFront(winId) {
    const win = document.getElementById(winId);
    if (!win) return;
    topZIndex++;
    win.style.zIndex = topZIndex;
    
    // Remove inactive class from active, add to others
    document.querySelectorAll('.win').forEach(w => w.classList.add('inactive'));
    win.classList.remove('inactive');
    updateTaskbar();
  }

  function openWindow(winId) {
    const win = document.getElementById(winId);
    if (!win) return;
    win.classList.remove('hidden');
    bringToFront(winId);
  }

  function closeWindow(winId) {
    const win = document.getElementById(winId);
    if (win) {
      win.classList.add('hidden');
      updateTaskbar();
    }
  }

  function minimizeWindow(winId) {
    const win = document.getElementById(winId);
    if (win) {
      win.classList.add('hidden');
      updateTaskbar();
    }
  }

  function toggleMaximize(winId) {
    const win = document.getElementById(winId);
    if (!win) return;
    if (win.getAttribute('data-maximized') === 'true') {
      win.style.top = win.getAttribute('data-prev-top') || '60px';
      win.style.left = win.getAttribute('data-prev-left') || '40px';
      win.style.width = win.getAttribute('data-prev-width') || '340px';
      win.style.height = 'auto';
      win.setAttribute('data-maximized', 'false');
    } else {
      win.setAttribute('data-prev-top', win.style.top);
      win.setAttribute('data-prev-left', win.style.left);
      win.setAttribute('data-prev-width', win.style.width);
      win.style.top = '0px';
      win.style.left = '0px';
      win.style.width = '100vw';
      win.style.height = 'calc(100vh - 40px)';
      win.setAttribute('data-maximized', 'true');
    }
  }

  function updateTaskbar() {
    const container = document.getElementById('taskbar-tasks');
    container.innerHTML = '';
    
    Object.keys(windows).forEach(id => {
      const win = document.getElementById(id);
      if (win && !win.classList.contains('hidden')) {
        const item = document.createElement('div');
        const isActive = !win.classList.contains('inactive') && win.style.zIndex == topZIndex;
        item.className = `task-item ${isActive ? 'active' : ''}`;
        item.innerHTML = `<span>${windows[id].icon}</span><span>${windows[id].title}</span>`;
        item.onclick = () => {
          if (isActive) {
            minimizeWindow(id);
          } else {
            openWindow(id);
          }
        };
        container.appendChild(item);
      }
    });
  }

  // Draggable window logic
  let activeDragWin = null;
  let dragOffsetX = 0, dragOffsetY = 0;

  function startDragWindow(e, winId) {
    if (e.target.tagName === 'BUTTON') return;
    bringToFront(winId);
    const win = document.getElementById(winId);
    if (win.getAttribute('data-maximized') === 'true') return;
    
    activeDragWin = win;
    const rect = win.getBoundingClientRect();
    dragOffsetX = (e.clientX || e.touches?.[0].clientX) - rect.left;
    dragOffsetY = (e.clientY || e.touches?.[0].clientY) - rect.top;

    window.addEventListener('mousemove', onDragWindow);
    window.addEventListener('mouseup', stopDragWindow);
    window.addEventListener('touchmove', onDragWindow, {passive: false});
    window.addEventListener('touchend', stopDragWindow);
  }

  function onDragWindow(e) {
    if (!activeDragWin) return;
    const clientX = e.clientX || e.touches?.[0].clientX;
    const clientY = e.clientY || e.touches?.[0].clientY;
    
    let x = clientX - dragOffsetX;
    let y = clientY - dragOffsetY;
    
    // Contain within viewport bounds
    x = Math.max(0, Math.min(x, window.innerWidth - 60));
    y = Math.max(0, Math.min(y, window.innerHeight - 80));

    activeDragWin.style.left = x + 'px';
    activeDragWin.style.top = y + 'px';
  }

  function stopDragWindow() {
    activeDragWin = null;
    window.removeEventListener('mousemove', onDragWindow);
    window.removeEventListener('mouseup', stopDragWindow);
    window.removeEventListener('touchmove', onDragWindow);
    window.removeEventListener('touchend', stopDragWindow);
  }

  /* ---------- Photo Viewer & Local Storage Logic ---------- */
  function getStoredPhotos() {
    try {
      return JSON.parse(localStorage.getItem('xp_user_photos') || '[]');
    } catch(e) {
      return [];
    }
  }

  function saveStoredPhotos(photos) {
    try {
      localStorage.setItem('xp_user_photos', JSON.stringify(photos));
    } catch(e) {
      alert("Storage quota exceeded! Try deleting older photos.");
    }
  }

  function handleImageUpload(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(event) {
      const caption = prompt("Enter a caption for this photo:", file.name) || "Memory";
      const photos = getStoredPhotos();
      photos.unshift({
        id: Date.now(),
        src: event.target.result,
        caption: caption
      });
      saveStoredPhotos(photos);
      renderPhotos();
    };
    reader.readAsDataURL(file);
    e.target.value = ''; // Reset input
  }

  function deletePhoto(id, e) {
    e.stopPropagation();
    let photos = getStoredPhotos();
    photos = photos.filter(p => p.id !== id);
    saveStoredPhotos(photos);
    renderPhotos();
  }

  function renderPhotos() {
    const grid = document.getElementById('photo-grid');
    const emptyMsg = document.getElementById('empty-photos');
    const countSpan = document.getElementById('photo-count');
    const photos = getStoredPhotos();

    grid.innerHTML = '';
    countSpan.textContent = `${photos.length} photo${photos.length === 1 ? '' : 's'}`;

    if (photos.length === 0) {
      emptyMsg.classList.remove('hidden');
    } else {
      emptyMsg.classList.add('hidden');
      photos.forEach(photo => {
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.onclick = () => openLightbox(photo.src, photo.caption);
        card.innerHTML = `
          <button class="del-btn" onclick="deletePhoto(${photo.id}, event)" title="Delete Photo">×</button>
          <img src="${photo.src}" alt="${photo.caption}">
          <div class="caption">${photo.caption}</div>
        `;
        grid.appendChild(card);
      });
    }
  }

  function openLightbox(src, caption) {
    document.getElementById('lb-img').src = src;
    document.getElementById('lb-caption').textContent = caption;
    document.getElementById('lightbox').classList.remove('hidden');
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.add('hidden');
  }
</script>

<script>
  // ---------- mascot: original CSS/SVG cat, walks, blinks, draggable, tap for heart ----------
  (function(){
    const mascot = document.getElementById('mascot');
    const inner = document.getElementById('mascot-inner');
    const eyes = mascot.querySelectorAll('.cat-eye');

    let x = 20;
    let dir = 1;         // 1 = facing right, -1 = facing left
    let targetX = 20;
    let pausedUntil = 0;
    let dragging = false;
    let dragStartX = 0, dragPointerStartX = 0, moved = false;

    function maxX(){ return window.innerWidth - mascot.offsetWidth - 8; }
    function pickNewTarget(){
      targetX = 8 + Math.random() * (maxX() - 8);
      pausedUntil = 0;
    }
    pickNewTarget();

    function setFacing(){
      inner.classList.toggle('face-left', dir < 0);
    }

    function loop(){
      if (!dragging) {
        const now = Date.now();
        if (now < pausedUntil) {
          mascot.classList.remove('walking');
        } else {
          const dx = targetX - x;
          if (Math.abs(dx) < 2) {
            mascot.classList.remove('walking');
            pausedUntil = now + 1200 + Math.random() * 2200;
            pickNewTarget();
          } else {
            dir = dx > 0 ? 1 : -1;
            setFacing();
            mascot.classList.add('walking');
            x += dir * 0.9;
            mascot.style.left = x + 'px';
          }
        }
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // occasional blink
    function blinkLoop(){
      eyes.forEach(e => e.classList.add('blink'));
      setTimeout(() => eyes.forEach(e => e.classList.remove('blink')), 120);
      setTimeout(blinkLoop, 1800 + Math.random() * 2600);
    }
    setTimeout(blinkLoop, 1500);

    // drag to pick up / tap for heart
    function onPointerDown(e){
      dragging = true;
      moved = false;
      mascot.classList.add('dragging');
      mascot.classList.remove('walking');
      dragStartX = x;
      dragPointerStartX = (e.touches ? e.touches[0].clientX : e.clientX);
      e.preventDefault();
    }
    function onPointerMove(e){
      if (!dragging) return;
      const px = (e.touches ? e.touches[0].clientX : e.clientX);
      const delta = px - dragPointerStartX;
      if (Math.abs(delta) > 4) moved = true;
      let newDir = delta === 0 ? dir : (delta > 0 ? 1 : -1);
      if (newDir !== dir) { dir = newDir; setFacing(); }
      x = Math.min(Math.max(8, dragStartX + delta), maxX());
      mascot.style.left = x + 'px';
    }
    function onPointerUp(){
      if (!dragging) return;
      dragging = false;
      mascot.classList.remove('dragging');
      if (!moved) popHeart();
      pickNewTarget();
      pausedUntil = Date.now() + 500;
    }

    mascot.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);
    mascot.addEventListener('touchstart', onPointerDown, {passive:false});
    window.addEventListener('touchmove', onPointerMove, {passive:false});
    window.addEventListener('touchend', onPointerUp);

    function popHeart(){
      const rect = mascot.getBoundingClientRect();
      const h = document.createElement('div');
      h.className = 'heart-pop';
      h.textContent = '💗';
      h.style.left = (rect.left + rect.width / 2 - 9) + 'px';
      h.style.top = (rect.top - 6) + 'px';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 950);
    }
  })();
</script>
